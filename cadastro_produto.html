<html lang="pt-BR">
<head>
<title>Loja Daniel</title>

<meta content="width=device-width, initial-scale=1" name="viewport"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<link href="Css/global.css" rel="stylesheet"/><link href="Css/formularios.css" rel="stylesheet"/><link href="Css/paginas/cadastro_produto.css" rel="stylesheet"/></head>
<body>
<div class="corpo">
<header>
<div class="logo"><strong>Loja Daniel</strong></div>
<nav>
<a href="interfaceinicial.html">Home</a>
<a href="masculino.html">Masculino</a>
<a href="feminino.html">Feminino</a>
<a href="lancamentos.html">Lançamentos</a>
<a href="carrinho.html">Carrinho</a>
<a href="contato.html">Contato</a>
<a href="perfil.html">Perfil</a>
</nav>
</header>
<div class="container produtos">
<br/>
<br/>
<div class="container">
<h2>Cadastro de Produto</h2>
<form action="#" method="post">
<label for="nome">Nome do Produto:</label>
<input id="nome" name="nome" required="" type="text"/>
<label for="categoria">Categoria:</label>
<select id="categoria" name="categoria" required="">
<option value="">Selecione...</option>
<option value="eletronicos">Masculino</option>
<option value="moveis">Feminino</option>
<option value="vestuario">Esportivo</option>
<option value="alimentos">Unissex</option>
</select>
<label for="preco">Preço (R$):</label>
<input id="preco" name="preco" required="" step="0.01" type="number"/>
<label for="descricao">Descrição:</label>
<textarea id="descricao" name="descricao" rows="4"></textarea>
<label for="estoque">Quantidade em Estoque:</label>
<input id="estoque" name="estoque" required="" type="number"/>
<label for="imagem">Imagem do Produto (URL):</label>
<input id="imagem" name="imagem" type="url"/>
<button type="submit">Cadastrar Produto</button>
</form>
</div>
</div>
<br/>
<footer>
<p>2025 Loja Daniel. Todos os direitos reservados.</p>
</footer>
</div></body>
</html>
